modId="dmzkicontrol"
version="${version}"
displayName="DMZ Ki Control - Controle Perfeito de Aura"
authors="jaqkcson"
description='''
Add-on para DragonMineZ inspirado no Goku da saga Black: prenda a aura dentro do corpo
(Selamento de Aura) para gastar muito menos ki mantendo uma transformacao (principalmente
o Super Saiyajin Blue), ganhar precisao e um pouco mais de poder.
O dominio cresce por forma com o tempo de pratica. Sem dominio, segurar o ki por tempo demais
causa tensao interna e a aura explode para fora.
'''

